<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Blob body: 10-lobe cloud shape traced from design reference -->
  <path d="
    M 100,20
    Q 117,46  147,35
    Q 146,66  176,75
    Q 157,100 176,125
    Q 146,134 147,165
    Q 117,154 100,180
    Q  83,154  53,165
    Q  54,134  24,125
    Q  43,100  24,75
    Q  54,66   53,35
    Q  83,46  100,20 Z
  "
    fill="#E4F2FA"
    stroke="#7BBCDF"
    stroke-width="7"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Left eye (larger, tilted) -->
  <g transform="translate(83,88) rotate(-12)">
    <ellipse cx="0" cy="0" rx="10" ry="14" fill="#F0E040"/>
    <ellipse cx="2" cy="-3" rx="4" ry="5" fill="#2A6090"/>
  </g>

  <!-- Right eye (slightly smaller, tilted other way) -->
  <g transform="translate(117,82) rotate(10)">
    <ellipse cx="0" cy="0" rx="8" ry="12" fill="#F0E040"/>
    <ellipse cx="2" cy="-3" rx="3" ry="4" fill="#2A6090"/>
  </g>

  <!-- Nose dot -->
  <circle cx="100" cy="116" r="6" fill="#5AAAD0"/>

  <!-- Bottom connector (the "line" the pet hangs from) -->
  <circle cx="100" cy="178" r="5" fill="#7BBCDF"/>
</svg>
